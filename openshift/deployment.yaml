apiVersion: apps/v1
kind: Deployment
metadata:
  name: math-solution-spring-client
  labels:
    app.kubernetes.io/name: math-solution-spring-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: math-solution-spring-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: math-solution-spring-client
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: math-solution-spring-client
          # GitHub Actions replaces this value with the immutable commit image.
          image: ghcr.io/replace-owner/math-solution-spring-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: DATABRICKS_REQUEST_TIMEOUT
              value: PT5M
            - name: DATABRICKS_TOKEN_REFRESH_MARGIN
              value: PT5M
          envFrom:
            - secretRef:
                name: math-solution-databricks
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
